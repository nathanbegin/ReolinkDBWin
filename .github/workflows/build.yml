name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else { $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Vérifier la clé publique de licence (releases)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $src = Get-Content src/ReolinkDBWin.Core/Licensing/LicensePublicKey.cs -Raw
          if ($src -match 'Value = "";') { Write-Error "LicensePublicKey.Value est vide : une release vendue doit vérifier les licences (voir docs/VENTE.md)."; exit 1 }

      - name: Tests
        run: dotnet test tests/ReolinkDBWin.Core.Tests -c Release

      - name: Publication (win-x64, autonome)
        run: dotnet publish src/ReolinkDBWin/ReolinkDBWin.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.value }} -o publish/VigieWidget

      - name: Archive portable
        shell: pwsh
        run: Compress-Archive -Path publish/VigieWidget/* -DestinationPath publish/VigieWidget-${{ steps.version.outputs.value }}-win-x64.zip

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=${{ steps.version.outputs.value }} /DSourceDir="$PWD\publish\VigieWidget" installer\VigieWidget.iss

      - uses: actions/upload-artifact@v4
        with:
          name: VigieWidget-${{ steps.version.outputs.value }}
          path: |
            publish/*.zip
            publish/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/*.zip
            publish/*.exe
