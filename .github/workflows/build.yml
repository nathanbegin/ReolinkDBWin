name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        run: dotnet test tests/ReolinkDBWin.Core.Tests -c Release

      - name: Publication (win-x64, autonome)
        run: dotnet publish src/ReolinkDBWin/ReolinkDBWin.csproj -c Release -r win-x64 --self-contained true -o publish/ReolinkDBWin

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path publish/ReolinkDBWin/* -DestinationPath publish/ReolinkDBWin-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ReolinkDBWin-win-x64
          path: publish/ReolinkDBWin-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ReolinkDBWin-win-x64.zip
